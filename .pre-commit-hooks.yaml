# pre-commit のフック。Docker があれば、Rust を入れなくても使える。
- id: sql-formatter
  name: sql-formatter
  description: SQL / PL/pgSQL のファイルを整形する
  entry: sql-formatter --write
  language: docker
  types: [sql]
- id: sql-formatter-check
  name: sql-formatter (check)
  description: SQL / PL/pgSQL のファイルが整形済みか確かめる（書き換えない）
  entry: sql-formatter --check
  language: docker
  types: [sql]
