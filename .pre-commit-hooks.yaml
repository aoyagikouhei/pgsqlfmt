# pre-commit のフック。Docker があれば、Rust を入れなくても使える。
- id: pgsqlfmt
  name: pgsqlfmt
  description: SQL / PL/pgSQL のファイルを整形する
  entry: pgsqlfmt --write
  language: docker
  types: [sql]
- id: pgsqlfmt-check
  name: pgsqlfmt (check)
  description: SQL / PL/pgSQL のファイルが整形済みか確かめる（書き換えない）
  entry: pgsqlfmt --check
  language: docker
  types: [sql]
