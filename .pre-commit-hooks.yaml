# pre-commit hooks. With Docker, they can be used without installing Rust.
- id: pgsqlfmt
  name: pgsqlfmt
  description: Format SQL / PL/pgSQL files
  entry: pgsqlfmt --write
  language: docker
  types: [sql]
- id: pgsqlfmt-check
  name: pgsqlfmt (check)
  description: Check that SQL / PL/pgSQL files are formatted (does not rewrite)
  entry: pgsqlfmt --check
  language: docker
  types: [sql]
