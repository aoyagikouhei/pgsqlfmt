[package]
name = "pgsqlfmt"
version = "0.2.0"
edition = "2024"
description = "PostgreSQL の SQL / PL/pgSQL のフォーマッター"
license = "MIT"
repository = "https://github.com/aoyagikouhei/pgsqlfmt"

[dependencies]

[dev-dependencies]
insta = { version = "1", features = ["glob"] }

# テストは最適化してビルドする（性質テストで大量の入力を整形するため）。デバッグ情報は残る
[profile.test]
opt-level = 1

# 配布するバイナリは記号表を取り除いて小さくする
[profile.release]
strip = true
