# When a tag such as `v0.1.0` is pushed, build Linux (amd64 / arm64) binaries and upload them to GitHub Releases.
# They are statically linked with musl, so they run on any Linux (including Alpine) regardless of the glibc version.
# The asset names do not include the version, so the latest version can be fetched from `releases/latest/download/<name>`.
# After the release, publish the crate to crates.io with Trusted Publishing (no API token is stored).
# When run manually (workflow_dispatch), it stops after the build and smoke test and does not create a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Never publish with a tag that does not match the version in Cargo.toml
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
            exit 1
          fi
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools file
          # Work on runner images that do not have rustup installed
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      # The verification against a real PostgreSQL runs in the CI on main (it is skipped here because PGHOST is not set)
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/pgsqlfmt
          file "$bin"
          out=$(printf 'select a, b from t where x = 1' | "$bin")
          expected=$(printf 'SELECT\n    a\n  , b\nFROM t\nWHERE x = 1')
          if [ "$out" != "$expected" ]; then
            printf 'unexpected output:\n%s\n' "$out"
            exit 1
          fi
      - name: Package
        run: |
          name=pgsqlfmt-${{ matrix.target }}
          mkdir -p dist package
          cp target/${{ matrix.target }}/release/pgsqlfmt README.md package/
          if [ -f LICENSE ]; then cp LICENSE package/; fi
          (cd package && tar -czf "../dist/${name}.tar.gz" -- *)
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: pgsqlfmt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # When re-run for the same tag, replace the assets of the existing release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  # Publish to crates.io after the GitHub release, so `cargo binstall` finds the assets.
  # Authenticates with GitHub OIDC; this repository and workflow must be registered as a
  # Trusted Publisher in the crate's settings on crates.io.
  # Skips when the version is already on crates.io (for example when it was published by hand).
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check whether the version is already published
        id: check
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'pgsqlfmt-release (github.com/aoyagikouhei/pgsqlfmt)' \
            "https://crates.io/api/v1/crates/pgsqlfmt/${version}")
          if [ "$status" = "200" ]; then
            echo "pgsqlfmt ${version} is already on crates.io; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install toolchain
        if: steps.check.outputs.skip != 'true'
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.skip != 'true'
        id: auth
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
