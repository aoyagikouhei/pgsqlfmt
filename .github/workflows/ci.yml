# push と PR ごとに、手元の `make check` と同じ検査（PostgreSQL での実機検証を含む）を Docker Compose で流す。
# あわせて配布用イメージ（pre-commit のフックが使う）をビルドし、実際に整形できるかを確かめる。
# 開発用イメージの層は GitHub Actions のキャッシュ（公開リポジトリは 10GB まで無料）に保存する。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # 開発コンテナのユーザーをランナーのユーザーと合わせる（作業ディレクトリをマウントして書き込むため）
      - name: Set up .env
        id: user
        run: |
          printf 'LOCAL_UID=%s\nLOCAL_GID=%s\n' "$(id -u)" "$(id -g)" > .env
          printf 'uid=%s\ngid=%s\n' "$(id -u)" "$(id -g)" >> "$GITHUB_OUTPUT"
      # 開発用イメージ（psql と cargo-insta のビルドを含む）は、層を GitHub Actions のキャッシュに保存して使い回す。
      # compose と同じ名前で読み込んでおけば、docker compose run はビルドせずにこのイメージを使う
      - uses: docker/setup-buildx-action@v4
      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev/Dockerfile
          build-args: |
            USER_UID=${{ steps.user.outputs.uid }}
            USER_GID=${{ steps.user.outputs.gid }}
          tags: sql-formatter-rs-dev:latest
          load: true
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max
      - name: fmt / clippy / test
        run: make check RUN_FLAGS=-T

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build distribution image
        run: make image
      - name: Format with the image
        run: |
          out=$(printf 'select a, b from t where x = 1' | docker run --rm -i sql-formatter)
          expected=$(printf 'SELECT\n    a\n  , b\nFROM t\nWHERE x = 1')
          if [ "$out" != "$expected" ]; then
            printf 'unexpected output:\n%s\n' "$out"
            exit 1
          fi
          # 整形済みのファイルを --check に通す
          printf '%s\n' "$expected" > formatted.sql
          docker run --rm -v "$PWD:/src" sql-formatter --check formatted.sql
