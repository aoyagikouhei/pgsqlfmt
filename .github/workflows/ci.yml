# On every push and PR, run the same checks as the local `make check` (including the verification
# against a real PostgreSQL) in Docker Compose.
# Also build the distribution image (used by the pre-commit hooks) and confirm that it actually formats.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Match the dev container's user to the runner's user (the working directory is mounted and written to)
      - name: Set up .env
        run: printf 'LOCAL_UID=%s\nLOCAL_GID=%s\n' "$(id -u)" "$(id -g)" > .env
      - name: Build dev image
        run: docker compose build dev
      - name: fmt / clippy / test
        run: make check RUN_FLAGS=-T

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build distribution image
        run: make image
      - name: Format with the image
        run: |
          out=$(printf 'select a, b from t where x = 1' | docker run --rm -i pgsqlfmt)
          expected=$(printf 'SELECT\n    a\n  , b\nFROM t\nWHERE x = 1')
          if [ "$out" != "$expected" ]; then
            printf 'unexpected output:\n%s\n' "$out"
            exit 1
          fi
          # Run --check on an already formatted file
          printf '%s\n' "$expected" > formatted.sql
          docker run --rm -v "$PWD:/src" pgsqlfmt --check formatted.sql
